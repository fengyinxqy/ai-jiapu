name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装依赖
        run: pip install -r requirements.txt
        working-directory: backend
      - name: 运行 pytest
        run: python -m pytest
        working-directory: backend

  frontend:
    name: 前端测试与构建（vitest + tsc）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
        working-directory: frontend
      - name: 运行 vitest
        run: npm test
        working-directory: frontend
      - name: 类型检查与构建
        run: npm run build
        working-directory: frontend
